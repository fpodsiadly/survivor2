name: Build Android i iOS

# Same flow as JumperIdle (PLAN.md K8): every push to main runs the tests, builds APK + AAB
# and publishes a release with stable links; the iOS IPA is built only on manual request.
on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS app (IPA)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :shared:testDebugUnitTest --no-daemon

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py shared/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

      # Without the KEYSTORE_B64 secret the debug key is used, so installs from different runs
      # may not update each other. Add the secrets (docs in README) to fix the signature.
      - name: Prepare signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_B64 secret, building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shared.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/shared.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  # iOS: the same game (:shared) as an iPhone app. Unsigned IPA, signed at install time
  # (e.g. Sideloadly with a free Apple ID). Manual only: macOS minutes count 10x.
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build iOS app
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          xcodebuild -project iosApp/Surv20.xcodeproj -target Surv20 \
            -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$CODE" \
            GRADLE_BIN="$(which gradle)" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R iosApp/build/Release-iphoneos/Surv20.app Payload/
          zip -qry Surv20.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Surv20.ipa

  # Release from main: APK, AAB and (if built now or before) IPA, stable links releases/latest/download/<file>.
  release:
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.android.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/app-debug/app-debug.apk Surv20.apk
          cp out/app-release-aab/app-release.aab Surv20.aab
          FILES="Surv20.apk Surv20.aab"
          if [ -f out/ios-ipa/Surv20.ipa ]; then
            cp out/ios-ipa/Surv20.ipa Surv20.ipa
            FILES="$FILES Surv20.ipa"
            IPA_NOTE="Surv20.ipa: iPhone, built in this release."
          elif gh release download --repo "${{ github.repository }}" --pattern Surv20.ipa --dir prev 2>/dev/null; then
            cp prev/Surv20.ipa Surv20.ipa
            FILES="$FILES Surv20.ipa"
            IPA_NOTE="Surv20.ipa: iPhone, from the previous release."
          else
            IPA_NOTE="No iPhone build yet (run the workflow manually with ios=true)."
          fi
          gh release create "build-${{ github.run_number }}" $FILES \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Surv20 build ${{ github.run_number }}" \
            --notes "Build from main (${{ github.sha }}). Surv20.apk: Android. Surv20.aab: Google Play. $IPA_NOTE"
