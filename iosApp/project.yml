# Xcode project generated by XcodeGen (CI: xcodegen generate). The .xcodeproj is not kept in the repo.
name: Surv20
options:
  bundleIdPrefix: com.surv20
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Surv20:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surv20.game
        PRODUCT_NAME: Surv20
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    preBuildScripts:
      - name: Kotlin (Shared.framework)
        script: |
          cd "$SRCROOT/.."
          "${GRADLE_BIN:-gradle}" :shared:embedAndSignAppleFrameworkForXcode --no-daemon
        basedOnDependencyAnalysis: false
